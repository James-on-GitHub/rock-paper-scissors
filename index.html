<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="main-container">
      <div id="heading-container">
        <h1 class="font">Rock | Paper | Scissors</h1>
      </div>

      <div id="sub-heading-container">
        <h3 class="font">Click an option below to play against the computer:</h3>
      </div>

      <div id="options-container">
        <button class="rock" type="button">✊</button>
        <button class="paper" type="button">✋</button>
        <button class="scissors" type="button">✌️</button>
      </div>
    </div>
  </body>
</html>
